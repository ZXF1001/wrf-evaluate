[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wrf-evaluate"
version = "0.1.0"
description = "WRF forecasts compared with station observations and CLDAS"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "netCDF4>=1.6.5",
    "tzdata>=2024.1",
    "python-calamine>=0.3",
    "matplotlib>=3.11.2",
]

[project.scripts]
wrf-evaluate = "wrf_evaluate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
