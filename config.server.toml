# 服务器运行入口；稳定的数据路径、时区和字段定义放在来源文件中。
source_config = "config.sources.toml"

[period]
# 时间须含时区：+08:00为北京时间，Z或+00:00为UTC；以下两行与当前时段等价。
# start = "2024-12-01T04:00:00Z"
# end = "2024-12-07T04:00:00Z"
start = "2024-12-01T12:00:00+08:00"
end = "2024-12-07T12:00:00+08:00"

[output]
directory = "output"
name = "wrf-test"
timezone = "Asia/Shanghai"

[[station]]
name = "水西沟"
longitude = 87.4897
latitude = 43.4733
time_tolerance_seconds = 60 # 默认60，非负整数秒；0严格同刻。只影响瞬时指标配对。

# Excel必填；文件缺失会在运行前报错；不自动搜索文件。
# station_id = "Y5012" # 可选：单站表自动读取站号，多站表须显式填写以筛选。
# files支持绝对路径或相对本运行配置的路径；一个站点可明确列出多个文件。
excel.files = ["/home/wrfadmin/user/zhangxf/wrf-evaluate/data/region/Y5012_乌鲁木齐县水西沟镇气象观测站_10.8_16.8.xls"]
excel.timezone = "UTC" # 观测原始时区；其他数据按实际改为Asia/Shanghai等。
excel.sheet = "气象数据" # 默认“气象数据”；当前支持A1表头的长表。
excel.time_format = "%Y%m%d%H%M%S" # 文本时间格式；也可用 "%Y-%m-%d %H:%M:%S"，Excel日期单元格自动识别。
excel.missing_values = [] # 字符串/数值缺测标记，例[-9999, "M"]；默认[]，只填数据实际使用的标记。
# 每个站点独立配置表头；省略的已知字段沿用样例默认定义。
excel.variables.station_id = { variable = "区站号" }
excel.variables.time = { variable = "观测时间" }
excel.variables.temperature_2m = { variable = "气温(°)", units = "degC", time_kind = "instant" }
excel.variables.relative_humidity_2m = { variable = "相对湿度(%RH)", units = "%", time_kind = "instant" }
# wind_speed按指定列读取；换成其他平均/瞬时风速列时同步调整时间含义。
excel.variables.wind_speed = { variable = "10min平均风速(m/s)", units = "m/s", time_kind = "mean", interval = "10min", timestamp = "end" }
# window可选hour_to_date（本小时累计，整点为前一小时总量）或rolling（过去interval时长）。
excel.variables.precipitation = { variable = "小时降水量(mm)", units = "mm", time_kind = "sum", interval = "1h", timestamp = "end", window = "hour_to_date" }

[[station]]
name = "水西沟镇东梁村"
longitude = 87.5289
latitude = 43.4503
time_tolerance_seconds = 60
excel.files = ["/home/wrfadmin/user/zhangxf/wrf-evaluate/data/region/Y5056_乌鲁木齐县水西沟镇东梁村气象观测站_13.5_23.7.xls"]
excel.timezone = "UTC"
excel.sheet = "气象数据"
excel.time_format = "%Y%m%d%H%M%S" # 文本时间格式；也可用 "%Y-%m-%d %H:%M:%S"，Excel日期单元格自动识别。
excel.missing_values = [] # 字符串/数值缺测标记，例[-9999, "M"]；默认[]，只填数据实际使用的标记。
excel.variables.station_id = { variable = "区站号" }
excel.variables.time = { variable = "观测时间" }
excel.variables.temperature_2m = { variable = "气温(°)", units = "degC", time_kind = "instant" }
excel.variables.relative_humidity_2m = { variable = "相对湿度(%RH)", units = "%", time_kind = "instant" }
excel.variables.wind_speed = { variable = "10min平均风速(m/s)", units = "m/s", time_kind = "mean", interval = "10min", timestamp = "end" }
excel.variables.precipitation = { variable = "小时降水量(mm)", units = "mm", time_kind = "sum", interval = "1h", timestamp = "end", window = "hour_to_date" }

[[plots]]
element = "temperature_2m"
type = "series"
# element可选：temperature_2m、relative_humidity_2m、wind_speed、precipitation、
# surface_shortwave_down、surface_longwave_down；type可选series/map。
figsize = [11, 4.8] # 英寸；series默认[11, 4.8]。
dpi = 160 # 正整数，默认160。
# y_limits = [-30, 10] # 可选：纵轴范围，采用要素统一单位；省略自动缩放。

[[plots]]
element = "temperature_2m"
type = "map"
layout = "timeline" # timeline：所有时刻同图，每行一个时刻；separate：每时刻单独出图。
interval = "12h" # 正整数+s/min/h/d，如30min、6h；省略默认6h，从period.start开始。
figsize = [12, 5] # 英寸：整图宽度、每行高度；默认[12, 5]，汇总图总高度随行数增加。
dpi = 160 # 正整数，默认160。
cmap = "viridis" # 默认viridis；可用coolwarm、RdBu_r、turbo等Matplotlib色表。
difference_cmap = "RdBu_r" # 差值色表，默认RdBu_r；可用coolwarm等。
# difference_limit = 5 # 可选：所有时刻差值共用[-5, 5]色标，采用要素统一单位；省略自动对称取值。
# color_limits = [-30, 10] # 可选：所有时刻预报/实况共用色标范围；省略自动取值。
# interval是出图间隔，不是降水累计窗口；窗口由来源字段定义。

[[metrics]]
element = "temperature_2m"
# 容差在[[station]]中配置。
# 复制[[plots]]/[[metrics]]增加任务；删除或整组注释即取消，无enabled开关。

[[plots]]
element = "relative_humidity_2m"
type = "series"
figsize = [11, 4.8] # 英寸。
dpi = 160
# y_limits = [0, 100] # 可选，单位%；省略自动缩放。

[[plots]]
element = "relative_humidity_2m"
type = "map"
layout = "timeline" # timeline：所有时刻同图，每行一个时刻；separate：每时刻单独出图。
interval = "6h" # 正整数+s/min/h/d，默认6h。
figsize = [12, 5] # 英寸：整图宽度、每行高度；默认[12, 5]，汇总图总高度随行数增加。
dpi = 160
cmap = "viridis" # Matplotlib色表，如coolwarm、RdBu_r、turbo。
difference_cmap = "RdBu_r" # 差值色表，默认RdBu_r；可用coolwarm等。
# difference_limit = 5 # 可选：所有时刻差值共用[-5, 5]色标，采用要素统一单位；省略自动对称取值。
# color_limits = [0, 100] # 可选：所有时刻预报/实况共用色标范围；省略自动取值。

[[metrics]]
element = "relative_humidity_2m"

[[plots]]
element = "wind_speed"
type = "series"
figsize = [11, 4.8]
dpi = 160
# y_limits = [0, 20] # 可选，单位m/s；省略自动缩放。

[[plots]]
element = "wind_speed"
type = "map"
layout = "timeline" # timeline：所有时刻同图，每行一个时刻；separate：每时刻单独出图。
interval = "6h"
figsize = [12, 5] # 英寸：整图宽度、每行高度；默认[12, 5]，汇总图总高度随行数增加。
dpi = 160
cmap = "viridis"
difference_cmap = "RdBu_r" # 差值色表，默认RdBu_r；可用coolwarm等。
# difference_limit = 5 # 可选：所有时刻差值共用[-5, 5]色标，采用要素统一单位；省略自动对称取值。
# color_limits = [0, 20] # 可选：所有时刻预报/实况共用色标范围；省略自动取值。

[[metrics]]
element = "wind_speed"

[[plots]]
element = "precipitation"
type = "series"
figsize = [11, 4.8]
dpi = 160
# y_limits = [0, 20] # 可选，单位mm；省略自动缩放。

[[plots]]
element = "precipitation"
type = "map"
layout = "timeline" # timeline：所有时刻同图，每行一个时刻；separate：每时刻单独出图。
interval = "6h" # 出图频率；雨量窗口由来源字段定义。
figsize = [12, 5] # 英寸：整图宽度、每行高度；默认[12, 5]，汇总图总高度随行数增加。
dpi = 160
cmap = "Blues"
difference_cmap = "RdBu_r" # 差值色表，默认RdBu_r；可用coolwarm等。
# difference_limit = 5 # 可选：所有时刻差值共用[-5, 5]色标，采用要素统一单位；省略自动对称取值。
# color_limits = [0, 20] # 可选：所有时刻预报/实况共用色标范围；省略自动取值。

[[metrics]]
element = "precipitation"
precipitation_thresholds_mm = [0.1, 1, 10] # 达到阈值即事件；默认[]，不统计降水事件率。
